server:
  port: 8080
spring:
  application:
    name: baaki
  datasource:
    url: jdbc:mysql://localhost:3307/baaki?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
    username: baaki
    password: baaki
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: Asia/Kolkata
  flyway:
    clean-disabled: false   # needed for "Reset demo"
  jackson:
    time-zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 7MB   # keep uploads in memory only: invoice photos are never written to disk
baaki:
  # GST rates in basis points (1800 = 18%). 0/5/18% are the main slabs since 22 Sep 2025, plus 3% and 40%.
  # Check current rates on cbic-gst.gov.in before relying on them.
  gst-rates-bp: [0, 300, 500, 1800, 4000]
  # RBI bank rate in percent. Check rbi.org.in for the current value.
  rbi-bank-rate-percent: 5.75
  letter-deadline-days: 7
  msme-max-days: 45
  e-invoice-threshold-paise: 5000000000   # Rs 5 crore
  hsn-six-digit-threshold-paise: 5000000000
  # Automatic email reminders. Secrets come from environment variables (see .env.example), never from this file.
  mail:
    provider: ${MAIL_PROVIDER:none}          # resend | smtp | none
    from-address: ${MAIL_FROM:}              # e.g. reminders@yourdomain.in (must be verified with the provider)
    resend-api-key: ${RESEND_API_KEY:}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5190}   # used to build invoice and pay links
  auto-send:
    cron: "0 0 10 * * *"                     # every day at 10:00, zone Asia/Kolkata
  # Reading existing invoices from a photo or PDF. The key comes from AI_API_KEY (see .env.example), never from this file.
  ai:
    provider: gemini
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-flash-latest}
    timeout-seconds: 60
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:}

