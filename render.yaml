databases:
  # Free Managed PostgreSQL Database on Render
  - name: baaki-db
    databaseName: baaki
    user: baaki
    plan: free
    region: oregon

services:
  # All-in-One: React Frontend + Spring Boot Backend in a single Docker container
  - type: web
    name: baaki
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/config
    envVars:
      # Activate PostgreSQL profile for Render
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      # Automatically connects to the free Render PostgreSQL database
      - key: DATABASE_URL
        fromDatabase:
          name: baaki-db
          property: connectionString
      # Google Gemini API key for scanning paper / PDF invoices
      - key: AI_API_KEY
        sync: false
      # Email reminders (none | resend | smtp)
      - key: MAIL_PROVIDER
        value: none
      - key: MAIL_FROM
        value: reminders@yourdomain.in
      - key: RESEND_API_KEY
        sync: false
      # Google OAuth 2.0 Client ID (optional, leave empty for Demo Login)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Public URL for invoice pay links
      - key: PUBLIC_BASE_URL
        sync: false
