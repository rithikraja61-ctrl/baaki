services:
  # Backend API - Spring Boot 3 on Java 21 (Docker)
  - type: web
    name: baaki-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/config
    envVars:
      # Database connection (e.g. from Aiven, TiDB Cloud, or Railway)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Google Gemini API key for scanning paper / PDF invoices
      - key: AI_API_KEY
        sync: false
      # Email reminders (none | resend | smtp)
      - key: MAIL_PROVIDER
        value: none
      - key: MAIL_FROM
        value: reminders@yourdomain.in
      - key: RESEND_API_KEY
        sync: false
      # Google OAuth 2.0 Client ID (optional, leave empty for Demo Login)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # CORS allowed origins (Render frontend URL or custom domain)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Public URL for invoice pay links
      - key: PUBLIC_BASE_URL
        sync: false

  # Frontend Web App - Vite + React (Static Site)
  - type: web
    name: baaki-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      # Single-Page Application (SPA) client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Connects frontend to the backend URL on Render (e.g. https://baaki-backend.onrender.com/api)
      - key: VITE_API_BASE_URL
        sync: false
